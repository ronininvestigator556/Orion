[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
orion-core = { path = "crates/orion-core" }

anyhow = "1"
bytemuck = { version = "1.25", features = ["derive"] }
csv = "1.4"
# egui bundles no fonts by default, so text is invisible without this feature.
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
env_logger = "0.11"
glam = "0.34"
# Only the JPEG decoder is needed, for the bundled Earth textures.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
log = "0.4"
pollster = "1"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
sgp4 = "2.4"
wgpu = "30"
winit = "0.30.13"

# Graphics code is unusably slow unoptimised, so optimise dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
