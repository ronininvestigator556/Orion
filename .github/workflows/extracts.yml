name: Extracts

# Builds the Extracts, the small files of places taken from OpenStreetMap that every
# copy of Orion downloads, and publishes them as the files of one release (ADR 0004).

on:
  schedule:
    # Early on Monday, at a minute nobody else picks.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Two runs at once would only upload over each other.
concurrency:
  group: extracts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    # Every query can be made to wait and be retried, so allow for a slow morning.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Build the Extracts
        env:
          # Tells the operators of OpenStreetMap's query service who is asking.
          ORION_EXTRACTS_CONTACT: ${{ github.server_url }}/${{ github.repository }}
        run: python3 tools/make_extracts.py extracts
      # Whatever was built is published even if some Extract failed: the run still
      # ends in failure, so it is noticed, and the failed one keeps its old copy.
      - name: Publish them
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls extracts/*.tsv >/dev/null 2>&1; then
            echo "No Extract was built."
            exit 1
          fi
          if ! gh release view extracts >/dev/null 2>&1; then
            gh release create extracts --latest=false --title "Extracts" \
              --notes "Files of places that Orion downloads, rebuilt every week from OpenStreetMap. © OpenStreetMap contributors, under the Open Database Licence. This is not a version of the app: for that, see the other releases."
          fi
          gh release upload extracts extracts/*.tsv --clobber
